<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Teddy Shuffle: Arena</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #fdfbf7 0%, #fff0d4 100%);
            --text-dark: #5d4037;
            --primary: #ffb300;
            --primary-dark: #e6a000;
            --accent: #ff6f00;
            --white: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; font-family: 'Nunito', system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; height: 100%; background: #fff0d4; background: var(--bg-gradient); color: var(--text-dark); overflow: hidden; position: fixed; top: 0; left: 0; }

        #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; overflow: hidden; }
        .falling-item { position: absolute; top: -50px; font-size: 24px; animation: fall linear infinite; opacity: 0.3; }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }

        .screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; z-index: 10; }
        .is-hidden { display: none !important; }
        .scroll-area { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; align-items: center; -webkit-overflow-scrolling: touch; }
        .spacer { flex: 1; min-height: 20px; }

        .btn {
            width: 100%; padding: 18px; border: none; border-radius: 22px;
            background: var(--primary); color: #fff; font-size: 1.1rem; font-weight: 900;
            box-shadow: 0 6px 0 var(--primary-dark); cursor: pointer; text-transform: uppercase;
        }
        .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--primary-dark); }

        /* --- GAME UI --- */
        .hud { width: 100%; max-width: 340px; display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 20px; }
        .pill { background: white; padding: 10px 15px; border-radius: 50px; font-weight: 900; font-size: 0.92rem; box-shadow: 0 4px 10px rgba(0,0,0,0.05); white-space: nowrap; }

        .game-board { position: relative; width: 100%; max-width: 320px; height: 180px; margin: 25px 0; }
        .pot { position: absolute; bottom: 0; width: 85px; height: 105px; cursor: pointer; z-index: 5; transition: left 0.55s cubic-bezier(0.45, 0.05, 0.55, 0.95), transform 0.3s; }
        .pot-body { width: 100%; height: 100%; background: linear-gradient(145deg, #ffca28, #f57c00); border-radius: 15px 15px 40px 40px; border-bottom: 6px solid #bf360c; position: relative; }
        .pot-label { position: absolute; bottom: 12px; width: 100%; text-align: center; font-size: 8px; font-weight: 900; color: rgba(255,255,255,0.6); letter-spacing: 0.5px; }
        .pot.lifted { transform: translateY(-80px) rotate(-5deg); }
        .honey { position: absolute; bottom: 20px; width: 35px; height: 35px; background: radial-gradient(circle at 30% 30%, #ffd740, #ff8f00); border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 15px #ffb300; z-index: 2; }

        /* --- HISTORY / HIGH SCORE VIEW (Exact Leaderboard Theme) --- */
        .lb-header { width: 100%; background: var(--primary); color: white; padding: 45px 20px 22px; text-align: center; border-radius: 0 0 35px 35px; position: relative; }
        .btn-close-x { position: absolute; top: 15px; right: 20px; background: rgba(0,0,0,0.1); border: none; color: white; width: 36px; height: 36px; border-radius: 50%; font-weight: 900; cursor: pointer; }
        .lb-scroll-container { flex: 1; overflow-y: scroll; width: 100%; display: flex; flex-direction: column; align-items: center; padding-bottom: 30px; -webkit-overflow-scrolling: touch; }
        .lb-content { width: 100%; max-width: 360px; padding: 20px; }
        .lb-row { display: flex; align-items: center; background: white; padding: 16px 18px; border-radius: 22px; margin-bottom: 12px; border: 1px solid #f0f0f0; }
        .rank-circle { width: 38px; height: 38px; background: #fff8e1; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; margin-right: 15px; border: 1px solid var(--primary); font-size: 0.85rem; }
        .player-box { flex: 1; }
        .player-name { font-weight: 900; font-size: 0.95rem; color: var(--text-dark); }
        .player-score { font-weight: 900; color: var(--primary-dark); font-size: 1.4rem; }

        .status { font-size: 1.6rem; font-weight: 900; color: var(--accent); margin-bottom: 15px; text-align: center; min-height: 45px; }
    </style>
</head>
<body>

    <div id="bg-canvas"></div>

    <!-- MAIN GAME SCREEN -->
    <div id="view-game" class="screen">
        <div class="scroll-area">
            <div class="hud">
                <div class="pill">🍯 <span id="txt-score">0</span></div>
                <div class="pill">⭐ Best: <span id="txt-best">0</span></div>
                <div class="pill" id="btn-show-lb" style="color:var(--accent); cursor:pointer;">🕒 History</div>
            </div>
            <div class="spacer"></div>
            <div class="status" id="game-status">Ready?</div>
            <div class="game-board" id="table"></div>
            <div class="spacer"></div>
            <button class="btn" id="btn-action" type="button" style="max-width: 280px;">Shuffle Pots</button>
            <div class="spacer"></div>
        </div>
    </div>

    <!-- LOCAL LAST 10 MATCHES & HIGH SCORE SCREEN -->
    <div id="view-lb" class="screen is-hidden" style="background: #fffbf2;">
        <div class="lb-header">
            <button class="btn-close-x" id="btn-hide-lb-top" type="button">✕</button>
            <h2 style="font-weight: 900; font-size: 1.6rem;">LAST 10 MATCHES</h2>
            <p id="lb-best-banner" style="font-weight: 800; font-size: 0.9rem; margin-top: 6px; opacity: 0.95;">All-Time Best: 0 🍯</p>
        </div>
        <div class="lb-scroll-container">
            <div class="lb-content" id="lb-list"></div>
        </div>
    </div>

    <script>
        var STORAGE_BEST = "teddy_local_best_v1";
        var STORAGE_HIST = "teddy_local_history_v1";

        var state = {
            score: 0,
            bestScore: 0,
            history: [],
            isPlaying: false,
            waiting: false,
            winId: 0,
            cups: []
        };
        var POSITIONS = ['10px', '115px', '220px'];

        // --- SAFE LOCAL STORAGE ---
        function loadLocalData() {
            try {
                var savedBest = localStorage.getItem(STORAGE_BEST);
                if (savedBest !== null) state.bestScore = parseInt(savedBest, 10) || 0;
                var savedHist = localStorage.getItem(STORAGE_HIST);
                if (savedHist) state.history = JSON.parse(savedHist) || [];
            } catch (e) {}
            document.getElementById('txt-best').innerText = state.bestScore;
        }

        function saveLocalData() {
            try {
                localStorage.setItem(STORAGE_BEST, String(state.bestScore));
                localStorage.setItem(STORAGE_HIST, JSON.stringify(state.history));
            } catch (e) {}
        }

        function formatDateTime(d) {
            var months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            var day = d.getDate();
            var mon = months[d.getMonth()];
            var hr = d.getHours();
            var min = d.getMinutes();
            var ampm = hr >= 12 ? "PM" : "AM";
            hr = hr % 12;
            if (hr === 0) hr = 12;
            var minStr = min < 10 ? "0" + min : String(min);
            return day + " " + mon + ", " + hr + ":" + minStr + " " + ampm;
        }

        function recordMatch(finalScore) {
            if (finalScore > state.bestScore) {
                state.bestScore = finalScore;
                document.getElementById('txt-best').innerText = state.bestScore;
            }
            var entry = {
                score: finalScore,
                time: formatDateTime(new Date())
            };
            state.history.unshift(entry);
            if (state.history.length > 10) {
                state.history = state.history.slice(0, 10);
            }
            saveLocalData();
        }

        // --- CALM AUDIO ENGINE ---
        var audioCtx = null;
        function playTone(freq, duration, type, vol) {
            try {
                type = type || 'sine';
                vol = vol || 0.05;
                if (!audioCtx) {
                    var Ctx = window.AudioContext || window.webkitAudioContext;
                    if (!Ctx) return;
                    audioCtx = new Ctx();
                }
                if (audioCtx.state === 'suspended') audioCtx.resume();
                var osc = audioCtx.createOscillator();
                var gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        var sounds = {
            click: function() { playTone(440, 0.15, 'sine', 0.04); },
            shuffle: function() { playTone(220, 0.08, 'triangle', 0.03); },
            win: function() { playTone(523, 0.3); setTimeout(function() { playTone(659, 0.4); }, 100); },
            fail: function() { playTone(110, 0.5, 'sawtooth', 0.04); }
        };

        // --- STATIC POOL OF 5 FALLING ITEMS (Zero Memory Leak) ---
        function initBackground() {
            var bg = document.getElementById('bg-canvas');
            for (var i = 0; i < 5; i++) {
                var el = document.createElement('div');
                el.className = 'falling-item';
                el.innerText = (i % 2 === 0) ? '🍯' : '🧸';
                el.style.left = (12 + i * 19) + 'vw';
                el.style.animationDuration = (4.5 + (i % 3) * 1.2) + 's';
                el.style.animationDelay = (i * 1.1) + 's';
                bg.appendChild(el);
            }
        }

        // --- GAME LOGIC ---
        function initBoard() {
            var table = document.getElementById('table');
            table.innerHTML = '<div class="honey" id="coin" style="opacity:0"></div>';
            state.cups = [];
            for (var i = 0; i < 3; i++) {
                var c = document.createElement('div');
                c.className = 'pot';
                c.style.left = POSITIONS[i];
                c.innerHTML = '<div class="pot-body"><div class="pot-label">unskyit.com</div></div>';
                state.cups.push({ id: i, posIndex: i, el: c });
                c.onclick = (function(idx) {
                    return function() { checkGuess(idx); };
                })(i);
                table.appendChild(c);
            }
        }

        function findCupById(id) {
            for (var i = 0; i < state.cups.length; i++) {
                if (state.cups[i].id === id) return state.cups[i];
            }
            return state.cups[0];
        }

        function findCupByPos(pos) {
            for (var i = 0; i < state.cups.length; i++) {
                if (state.cups[i].posIndex === pos) return state.cups[i];
            }
            return state.cups[0];
        }

        document.getElementById('btn-action').onclick = function() {
            if (state.isPlaying || state.waiting) return;
            sounds.click();
            state.isPlaying = true;
            state.winId = Math.floor(Math.random() * 3);
            var winCup = findCupById(state.winId);
            var coin = document.getElementById('coin');
            var status = document.getElementById('game-status');

            status.innerText = "Watch!";
            coin.style.left = "calc(" + POSITIONS[winCup.posIndex] + " + 24px)";
            coin.style.opacity = 1;
            winCup.el.classList.add('lifted');

            setTimeout(function() {
                winCup.el.classList.remove('lifted');
                coin.style.opacity = 0;

                setTimeout(function() {
                    status.innerText = "Shuffling...";
                    var count = 6 + Math.min(state.score, 10);
                    var step = 0;
                    var delay = 550 - Math.min(state.score * 15, 250);

                    function doSwap() {
                        if (step >= count) {
                            status.innerText = "Where is it?";
                            state.isPlaying = false;
                            state.waiting = true;
                            return;
                        }
                        sounds.shuffle();
                        var p1 = Math.floor(Math.random() * 3);
                        var p2 = Math.floor(Math.random() * 3);
                        while (p1 === p2) p2 = Math.floor(Math.random() * 3);
                        var c1 = findCupByPos(p1);
                        var c2 = findCupByPos(p2);
                        c1.el.style.left = POSITIONS[p2];
                        c2.el.style.left = POSITIONS[p1];
                        c1.posIndex = p2;
                        c2.posIndex = p1;
                        step++;
                        setTimeout(doSwap, delay);
                    }
                    doSwap();
                }, 600);
            }, 1000);
        };

        function checkGuess(id) {
            if (state.isPlaying || !state.waiting) return;
            state.waiting = false;
            state.isPlaying = true;

            var coin = document.getElementById('coin');
            var winCup = findCupById(state.winId);
            var clicked = findCupById(id);

            coin.style.left = "calc(" + POSITIONS[winCup.posIndex] + " + 24px)";
            clicked.el.classList.add('lifted');

            if (id === state.winId) {
                sounds.win();
                document.getElementById('game-status').innerText = "Found! 🍯";
                coin.style.opacity = 1;
                state.score++;
                document.getElementById('txt-score').innerText = state.score;

                if (state.score > state.bestScore) {
                    state.bestScore = state.score;
                    document.getElementById('txt-best').innerText = state.bestScore;
                    saveLocalData();
                }

                setTimeout(function() {
                    clicked.el.classList.remove('lifted');
                    state.isPlaying = false;
                    document.getElementById('btn-action').click();
                }, 1200);
            } else {
                sounds.fail();
                document.getElementById('game-status').innerText = "Oops! 🐻";
                var endedScore = state.score;
                recordMatch(endedScore);

                setTimeout(function() {
                    winCup.el.classList.add('lifted');
                    coin.style.opacity = 1;
                    state.score = 0;
                    document.getElementById('txt-score').innerText = 0;

                    setTimeout(function() {
                        initBoard();
                        state.isPlaying = false;
                        document.getElementById('game-status').innerText = "Try Again?";
                    }, 2000);
                }, 800);
            }
        }

        function getTitle(s) {
            if (s >= 50) return "<p style='font-size:11px; color:#8d6e63; margin-top:2px;'>Legendary 🔥</p>";
            if (s >= 25) return "<p style='font-size:11px; color:#8d6e63; margin-top:2px;'>Elite ⚡</p>";
            if (s >= 15) return "<p style='font-size:11px; color:#8d6e63; margin-top:2px;'>Master 🏆</p>";
            if (s >= 5) return "<p style='font-size:11px; color:#8d6e63; margin-top:2px;'>Pro ⭐</p>";
            return "<p style='font-size:11px; color:#8d6e63; margin-top:2px;'>Rookie 🌱</p>";
        }

        // --- HISTORY VIEW ---
        document.getElementById('btn-show-lb').onclick = function() {
            sounds.click();
            document.getElementById('view-game').classList.add('is-hidden');
            document.getElementById('view-lb').classList.remove('is-hidden');
            document.getElementById('lb-best-banner').innerText = "All-Time Best: " + state.bestScore + " 🍯 (" + (state.bestScore >= 50 ? "Legendary" : state.bestScore >= 25 ? "Elite" : state.bestScore >= 15 ? "Master" : state.bestScore >= 5 ? "Pro" : "Rookie") + ")";

            var list = document.getElementById('lb-list');
            if (!state.history || state.history.length === 0) {
                list.innerHTML = "<p style='text-align:center; padding:20px; font-weight:700; color:#8d6e63;'>No matches played yet.<br>Play a round to log your history!</p>";
                return;
            }

            var html = "";
            for (var i = 0; i < state.history.length; i++) {
                var item = state.history[i];
                var badge = (item.score === state.bestScore && item.score > 0) ? '🏆' : '#' + (i + 1);
                html += '<div class="lb-row">' +
                    '<div class="rank-circle">' + badge + '</div>' +
                    '<div class="player-box">' +
                        '<span class="player-name">' + item.time + '</span>' +
                        getTitle(item.score) +
                    '</div>' +
                    '<div class="player-score">🍯 ' + item.score + '</div>' +
                '</div>';
            }
            list.innerHTML = html;
        };

        document.getElementById('btn-hide-lb-top').onclick = function() {
            sounds.click();
            document.getElementById('view-lb').classList.add('is-hidden');
            document.getElementById('view-game').classList.remove('is-hidden');
        };

        // --- INIT ---
        loadLocalData();
        initBackground();
        initBoard();
    </script>
</body>
</html>
