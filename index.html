<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Teddy Shuffle: Arena</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');

        :root {
            --bg-gradient: linear-gradient(135deg, #fdfbf7 0%, #fff0d4 100%);
            --text-dark: #5d4037;
            --primary: #ffb300;
            --primary-dark: #e6a000;
            --accent: #ff6f00;
            --white: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Nunito', sans-serif; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; height: 100%; background: var(--bg-gradient); color: var(--text-dark); overflow: hidden; }

        #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; overflow: hidden; }
        .falling-item { position: absolute; top: -50px; font-size: 24px; animation: fall linear infinite; opacity: 0.3; }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }

        .screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; z-index: 10; }
        .is-hidden { display: none !important; }
        .scroll-area { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; align-items: center; -webkit-overflow-scrolling: touch; }
        .spacer { flex: 1; min-height: 20px; }

        /* --- CLEAN ARENA LOGIN --- */
        .card {
            background: var(--white); border-radius: 35px;
            box-shadow: 0 20px 45px rgba(93, 64, 55, 0.15);
            padding: 40px 25px; width: 100%; max-width: 340px;
            text-align: center; margin: auto; position: relative;
            border: 4px solid var(--white);
        }
        .arena-badge { 
            display: inline-block; background: #fff3e0; color: var(--accent);
            padding: 6px 16px; border-radius: 50px; font-weight: 900; font-size: 0.75rem;
            letter-spacing: 1px; margin-bottom: 15px;
        }

        .title-group h1 { font-size: 2rem; font-weight: 900; margin-bottom: 5px; color: var(--text-dark); }
        .title-group p { font-size: 0.9rem; font-weight: 700; color: #8d6e63; margin-bottom: 25px; }

        .input-group { position: relative; width: 100%; margin-bottom: 15px; }
        .inp {
            width: 100%; padding: 18px; border: 2px solid #f5f5f5; border-radius: 20px;
            background: #fafafa; color: var(--text-dark); font-size: 1rem; font-weight: 700; outline: none;
        }
        .inp:focus { border-color: var(--primary); background: #fff; }
        .toggle-pwd { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); cursor: pointer; opacity: 0.6; }

        .btn {
            width: 100%; padding: 18px; border: none; border-radius: 22px;
            background: var(--primary); color: #fff; font-size: 1.1rem; font-weight: 900;
            box-shadow: 0 6px 0 var(--primary-dark); cursor: pointer; text-transform: uppercase;
        }
        .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--primary-dark); }

        /* --- GAME UI --- */
        .hud { width: 100%; max-width: 340px; display: flex; justify-content: space-between; margin-bottom: 20px; }
        .pill { background: white; padding: 10px 18px; border-radius: 50px; font-weight: 900; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

        .game-board { position: relative; width: 100%; max-width: 320px; height: 180px; margin: 25px 0; }
        .pot { position: absolute; bottom: 0; width: 85px; height: 105px; cursor: pointer; z-index: 5; transition: left 0.55s cubic-bezier(0.45, 0.05, 0.55, 0.95), transform 0.3s; }
        .pot-body { width: 100%; height: 100%; background: linear-gradient(145deg, #ffca28, #f57c00); border-radius: 15px 15px 40px 40px; border-bottom: 6px solid #bf360c; position: relative; }
        .pot-label { position: absolute; bottom: 12px; width: 100%; text-align: center; font-size: 8px; font-weight: 900; color: rgba(255,255,255,0.6); letter-spacing: 0.5px; }
        .pot.lifted { transform: translateY(-80px) rotate(-5deg); }
        .honey { position: absolute; bottom: 20px; width: 35px; height: 35px; background: radial-gradient(circle at 30% 30%, #ffd740, #ff8f00); border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 15px #ffb300; z-index: 2; }

        /* --- LEADERBOARD --- */
        .lb-header { width: 100%; background: var(--primary); color: white; padding: 55px 20px 25px; text-align: center; border-radius: 0 0 35px 35px; position: relative; }
        .btn-close-x { position: absolute; top: 15px; right: 20px; background: rgba(0,0,0,0.1); border: none; color: white; width: 36px; height: 36px; border-radius: 50%; font-weight: 900; cursor: pointer; }
        .lb-scroll-container { flex: 1; overflow-y: scroll; width: 100%; display: flex; flex-direction: column; align-items: center; padding-bottom: 30px; -webkit-overflow-scrolling: touch; }
        .lb-content { width: 100%; max-width: 360px; padding: 25px 20px; }
        .lb-row { display: flex; align-items: center; background: white; padding: 18px; border-radius: 22px; margin-bottom: 12px; border: 1px solid #f0f0f0; }
        .rank-circle { width: 38px; height: 38px; background: #fff8e1; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; margin-right: 15px; border: 1px solid var(--primary); }
        .player-box { flex: 1; }
        .player-score { font-weight: 900; color: var(--primary-dark); font-size: 1.4rem; }

        .status { font-size: 1.6rem; font-weight: 900; color: var(--accent); margin-bottom: 15px; text-align: center; min-height: 45px; }

    </style>
</head>
<body>

    <div id="bg-canvas"></div>

    <div id="view-login" class="screen">
        <div class="scroll-area">
            <div class="spacer"></div>
            <div class="card">
                <div class="arena-badge">Welcome To Honey Arena</div>
                <div class="title-group">
                    <h1>Teddy Shuffle 🍯</h1>
                    <p>Enter a unique username to register and play. Make sure you remember your details.</p>
                </div>
                <div class="input-group">
                    <input type="text" id="inp-handle" class="inp" placeholder="Username" maxlength="12">
                </div>
                <div class="input-group">
                    <input type="password" id="inp-pwd" class="inp" placeholder="Password">
                    <span class="toggle-pwd" id="btn-toggle">👁️</span>
                </div>
                <p id="login-msg" style="color:red; font-size:0.8rem; font-weight:bold; margin-bottom:15px; height:15px;"></p>
                <button class="btn" id="btn-login" type="button">Join Game</button>
                <div style="margin-top:25px; padding:5px; font-size:12px; background-color:#f5f5f5; border-radius:6px;">
                 If you are facing any error or forgotten your details then contact "unskyit@gmail.com".
</div>
            </div>
            <div class="spacer"></div>
        </div>
    </div>

    <div id="view-game" class="screen is-hidden">
        <div class="scroll-area">
            <div class="hud">
                <div class="pill">🍯 <span id="txt-score">0</span></div>
                <div class="pill" id="btn-show-lb" style="color:var(--accent); cursor:pointer;">🏆 Ranking</div>
            </div>
            <div class="spacer"></div>
            <div class="status" id="game-status">Ready?</div>
            <div class="game-board" id="table"></div>
            <div class="spacer"></div>
            <button class="btn" id="btn-action" type="button" style="max-width: 280px;">Shuffle Pots</button>
            <div class="spacer"></div>
        </div>
    </div>

    <div id="view-lb" class="screen is-hidden" style="background: #fffbf2;">
        <div class="lb-header">
            <button class="btn-close-x" id="btn-hide-lb-top" type="button">✕</button>
            <h2 style="font-weight: 900; font-size: 1.8rem;">LEADERBOARD</h2>
        </div>
        <div class="lb-scroll-container">
            <div class="lb-content" id="lb-list"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { initializeAuth, inMemoryPersistence, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { initializeFirestore, doc, setDoc, getDoc, collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC26LXwQc5EnEkRIjKQi4d2SzJRKNemGm4",
            authDomain: "teddy-shuffel.firebaseapp.com",
            projectId: "teddy-shuffel",
            storageBucket: "teddy-shuffel.firebasestorage.app",
            messagingSenderId: "858055132182",
            appId: "1:858055132182:web:92bad25ddcb8f852e2e137"
        };
        const app = initializeApp(firebaseConfig);
        // Fixes MacroDroid WebView IndexedDB & WebChannel login freeze
        const auth = initializeAuth(app, { persistence: inMemoryPersistence });
        const db = initializeFirestore(app, { experimentalForceLongPolling: true });

        const state = { score: 0, isPlaying: false, winId: 0, handle: "", cups: [] };
        const POSITIONS = ['10px', '115px', '220px']; 

        // --- CALM AUDIO ENGINE ---
        let audioCtx = null;
        function initAudio() { if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }

        function playTone(freq, duration, type = 'sine', vol = 0.05) {
            initAudio();
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        const sounds = {
            click: () => playTone(440, 0.15, 'sine', 0.04),
            shuffle: () => playTone(220, 0.08, 'triangle', 0.03),
            win: () => { playTone(523, 0.3); setTimeout(() => playTone(659, 0.4), 100); },
            fail: () => playTone(110, 0.5, 'sawtooth', 0.04)
        };

        // --- UI ---
        document.getElementById('btn-toggle').onclick = () => {
            sounds.click();
            const inp = document.getElementById('inp-pwd');
            inp.type = inp.type === 'password' ? 'text' : 'password';
            document.getElementById('btn-toggle').innerText = inp.type === 'password' ? '👁️' : '🙈';
        };

        setInterval(() => {
            const el = document.createElement('div');
            el.className = 'falling-item';
            el.innerText = Math.random() > 0.5 ? '🍯' : '🧸';
            el.style.left = Math.random() * 95 + 'vw';
            el.style.animationDuration = (Math.random() * 3 + 4) + 's';
            document.getElementById('bg-canvas').appendChild(el);
            setTimeout(() => el.remove(), 7000);
        }, 2000);

        // --- AUTH ---
        document.getElementById('btn-login').onclick = async () => {
            sounds.click();
            const h = document.getElementById('inp-handle').value.trim();
            const p = document.getElementById('inp-pwd').value;
            const msg = document.getElementById('login-msg');
            if(!h || !p) { msg.innerText = "Check details!"; return; }
            msg.innerText = "Connecting...";
            state.handle = h;
            const email = `${h.toLowerCase().replace(/[^a-z0-9]/g,'')}@teddy.game`;
            try {
                await signInWithEmailAndPassword(auth, email, p);
            } catch(e) {
                try {
                    const c = await createUserWithEmailAndPassword(auth, email, p);
                    setDoc(doc(db, "users", c.user.uid), { handle: h, bestScore: 0 }).catch(()=>{});
                    setDoc(doc(db, "leaderboard", c.user.uid), { handle: h, score: 0 }).catch(()=>{});
                } catch(err) { msg.innerText = "Error or Name Taken."; }
            }
        };

        onAuthStateChanged(auth, async (u) => {
            if(u) {
                document.getElementById('view-login').classList.add('is-hidden');
                document.getElementById('view-game').classList.remove('is-hidden');
                state.score = 0;
                initBoard();
                try {
                    const d = await getDoc(doc(db, "users", u.uid));
                    if(d.exists()) { state.handle = d.data().handle; }
                } catch(e) {}
            }
        });

        function initBoard() {
            const table = document.getElementById('table');
            table.innerHTML = '<div class="honey" id="coin" style="opacity:0"></div>';
            state.cups = [];
            for(let i=0; i<3; i++) {
                const c = document.createElement('div');
                c.className = 'pot';
                c.style.left = POSITIONS[i];
                c.innerHTML = `<div class="pot-body"><div class="pot-label">unskyit.com</div></div>`;
                state.cups.push({ id: i, posIndex: i, el: c });
                c.onclick = () => checkGuess(i);
                table.appendChild(c);
            }
        }

        document.getElementById('btn-action').onclick = async () => {
            if(state.isPlaying) return;
            sounds.click();
            state.isPlaying = true;
            state.winId = Math.floor(Math.random()*3);
            const winCup = state.cups.find(c => c.id === state.winId);
            const coin = document.getElementById('coin');
            const status = document.getElementById('game-status');
            
            status.innerText = "Watch!";
            coin.style.left = `calc(${POSITIONS[winCup.posIndex]} + 24px)`;
            coin.style.opacity = 1;
            winCup.el.classList.add('lifted');
            await new Promise(r => setTimeout(r, 1000));
            winCup.el.classList.remove('lifted');
            coin.style.opacity = 0;
            await new Promise(r => setTimeout(r, 600));

            status.innerText = "Shuffling...";
            let count = 6 + Math.min(state.score, 10);
            for(let k=0; k<count; k++) {
                sounds.shuffle();
                let p1 = Math.floor(Math.random()*3), p2 = Math.floor(Math.random()*3);
                while(p1===p2) p2 = Math.floor(Math.random()*3);
                let c1 = state.cups.find(c => c.posIndex === p1), c2 = state.cups.find(c => c.posIndex === p2);
                c1.el.style.left = POSITIONS[p2]; c2.el.style.left = POSITIONS[p1];
                c1.posIndex = p2; c2.posIndex = p1;
                await new Promise(r => setTimeout(r, 550 - Math.min(state.score * 15, 250)));
            }
            status.innerText = "Where is it?";
            state.isPlaying = false;
            state.waiting = true;
        };

        async function checkGuess(id) {
            if(state.isPlaying || !state.waiting) return;
            state.waiting = false;
            const coin = document.getElementById('coin');
            const winCup = state.cups.find(c => c.id === state.winId);
            const clicked = state.cups.find(c => c.id === id);
            
            coin.style.left = `calc(${POSITIONS[winCup.posIndex]} + 24px)`;
            clicked.el.classList.add('lifted');

            if(id === state.winId) {
                sounds.win();
                document.getElementById('game-status').innerText = "Found! 🍯";
                coin.style.opacity = 1;
                state.score++;
                document.getElementById('txt-score').innerText = state.score;
                setDoc(doc(db, "leaderboard", auth.currentUser.uid), { handle: state.handle, score: state.score }, {merge: true}).catch(()=>{});
                await new Promise(r => setTimeout(r, 1200));
                clicked.el.classList.remove('lifted');
                document.getElementById('btn-action').click();
            } else {
                sounds.fail();
                document.getElementById('game-status').innerText = "Oops! 🐻";
                await new Promise(r => setTimeout(r, 800));
                winCup.el.classList.add('lifted');
                coin.style.opacity = 1;
                state.score = 0;
                document.getElementById('txt-score').innerText = 0;
                await new Promise(r => setTimeout(r, 2000));
                initBoard();
                document.getElementById('game-status').innerText = "Try Again?";
            }
        }

        function getTitle(s) {
            if(s >= 50) return "<br><p style='font-size:11px;'>Legendary 🔥</p>";
            if(s >= 25) return "<br><p style='font-size:11px;'>Elite ⚡</p>";
            if(s >= 15) return "<br><p style='font-size:11px;'>Master 🏆</p>";
            if(s >= 5) return "<br><p style='font-size:11px;'>Pro ⭐</p>"; 
            return "<br><p style='font-size:11px;'>Rookie 🌱</p>";
        }

        document.getElementById('btn-show-lb').onclick = async () => {
            sounds.click();
            document.getElementById('view-game').classList.add('is-hidden');
            document.getElementById('view-lb').classList.remove('is-hidden');
            const list = document.getElementById('lb-list');
            list.innerHTML = "<p style='text-align:center; padding:20px;'>Syncing...</p>";
            try {
                const q = query(collection(db, "leaderboard"), orderBy("score", "desc"), limit(40));
                const snap = await getDocs(q);
                let html = ""; let i = 1;
                snap.forEach(d => {
                    const v = d.data();
                    const rank = i === 1 ? '🥇' : i === 2 ? '🥈' : i === 3 ? '🥉' : i;
                    html += `<div class="lb-row"><div class="rank-circle">${rank}</div><div class="player-box"><span class="player-name">${v.handle}</span><span class="player-title">${getTitle(v.score)}</span></div><div class="player-score">${v.score}</div></div>`;
                    i++;
                });
                list.innerHTML = html || "Empty Arena.";
            } catch(e) { list.innerHTML = "Sync Error."; }
        };

        document.getElementById('btn-hide-lb-top').onclick = () => {
            sounds.click();
            document.getElementById('view-lb').classList.add('is-hidden');
            document.getElementById('view-game').classList.remove('is-hidden');
        };

    </script>
</body>
</html>
